# Advances the live Arena every hour and commits the new leaderboard.
# The season started when this repo went live; agents/data/state.json carries it hour to hour.
name: arena
on:
  schedule: [{ cron: "5 * * * *" }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: arena, cancel-in-progress: false }
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node src/run.js --tick
        working-directory: agents
      - run: |
          git config user.name "conclave-arena"
          git config user.email "arena@users.noreply.github.com"
          git add web/public/arena.json agents/data/state.json
          git diff --cached --quiet || git commit -m "arena: hourly tick"
          git push
